name: Release IntelliJ Plugin
on:
  push:
    branches:
      - main
    paths:
      - "intellij/gradle.properties"

jobs:
  detect-version-change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      has_changed: ${{ steps.check-change.outputs.has_changed }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      
      - name: Extract Current Version
        id: extract-version
        shell: bash
        run: |
          VERSION=$(grep "pluginVersion" intellij/gradle.properties | cut -d'=' -f2 | xargs)
          echo "Current version from properties file: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Check If Version Changed
        id: check-change
        shell: bash
        run: |
          # Get the previous commit on this branch
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)
          
          # Get the previous version
          if git cat-file -e ${PREVIOUS_COMMIT}:intellij/gradle.properties 2>/dev/null; then
            PREVIOUS_VERSION=$(git show ${PREVIOUS_COMMIT}:intellij/gradle.properties | grep "pluginVersion" | cut -d'=' -f2 | xargs)
            echo "Previous version: $PREVIOUS_VERSION"
          else
            echo "Previous version file doesn't exist"
            echo "has_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Get current version
          CURRENT_VERSION="${{ steps.extract-version.outputs.version }}"
          
          echo "Current version: $CURRENT_VERSION"
          
          if [[ "$PREVIOUS_VERSION" != "$CURRENT_VERSION" ]]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "has_changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged: $CURRENT_VERSION"
            echo "has_changed=false" >> $GITHUB_OUTPUT
          fi