name: Atlas Declarative Auto

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: pass
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN_PW7QHH }}

      - name: Inspect current schema
        run: atlas schema inspect --config file://atlas.hcl --env test

      - name: Diff current and desired schema
        run: atlas schema diff --config file://atlas.hcl --env test --from env://url --to file://schema-1.lt.hcl

      - name: Plan schema changes
        id: plan
        uses: ariga/atlas-action/schema/plan@v1
        with:
          from: env://url
          to: file://schema-1.lt.hcl
          config: file://atlas.hcl
          env: test

      - name: Approve schema plan
        id: approve
        uses: ariga/atlas-action/schema/plan/approve@v1
        with:
          plan: ${{ steps.plan.outputs.plan }}
          config: file://atlas.hcl
          env: test

      - name: Apply approved schema plan
        uses: ariga/atlas-action/schema/apply@v1
        with:
          plan: ${{ steps.approve.outputs.plan }}
          config: file://atlas.hcl
          env: test