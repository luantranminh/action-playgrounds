name: CD/VSCode - Marketplace
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Version
        id: package-version
        working-directory: packages/vscode
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create and push tag
        if: success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "vscode-ext@v${{ steps.package-version.outputs.version }}" -m "Release vscode-ext@v${{ steps.package-version.outputs.version }}"
          git push origin "vscode-ext@v${{ steps.package-version.outputs.version }}"
      
